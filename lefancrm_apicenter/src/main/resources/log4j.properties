
#DEBUG,CONSOLE,FILE,ROLLING_FILE,MAIL,DATABASE

log4j.rootLogger=DEBUG,CONSOLE

log4j.logger.org.apache=DEBUG
log4j.logger.org.apache.catalina=DEBUG
log4j.logger.org.apache.tomcat=DEBUG
log4j.logger.httpclient.wire=DEBUG
log4j.logger.org.webharvest=DEBUG
log4j.logger.org.apache.solr=DEBUG
log4j.logger.org.apache.http=DEBUG

log4j.logger.org.springframework=DEBUG
log4j.logger.org.mybatis.spring.mapper=DEBUG
log4j.logger.com.opensymphony=DEBUG
log4j.logger.java.sql=DEBUG
log4j.logger.java.sql.ResultSet=DEBUG
log4j.logger.java.sql.PreparedStatement=DEBUG
log4j.logger.com.bandex.base=INFO




##
###################
# Console Appender
#
###################
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.Threshold=DEBUG
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d %-5p APICENTER [%t](%c:%L) -%m%n




